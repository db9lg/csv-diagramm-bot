name: Täglichen CSV-Download und Diagramm ausführen

on:
  schedule:
    # Läuft täglich um 13:00 Uhr UTC (14:00 Uhr MEZ / 15:00 Uhr MESZ)
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: CSV-Datei herunterladen
        run: |
          curl -fSL "https://wesis.bkg.bund.de/clt_f107_nf_final.txt" -o clt_f107_nf_final.txt
          curl -fSL "https://kp.gfz.de/app/files/Kp_ap_Ap_SN_F107_since_1932.txt" -o gfz_since_1932.txt

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Diagramme generieren
        run: |
          pip install pandas matplotlib
          python create_chart.py

      - name: Diagramme auf GitHub Pages veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: false
          enable_jekyll: false
          allow_empty_commit: true
          commit_message: "Update Solar Flux Diagramme"


